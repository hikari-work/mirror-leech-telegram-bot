[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv", "qBittorrent"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E722 bare except)
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort — import order
    "UP",   # pyupgrade
    "C901", # mccabe complexity
    "S307", # suspicious eval usage
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Ledger utang lint: temuan yang sudah ada sebelum refactor, dicabut per fase
# (lihat REFACTOR_PLAN.md §3). Saat suatu fase menyentuh file, hapus barisnya
# dan bereskan temuan yang tersisa — baru dianggap selesai.
[tool.ruff.lint.per-file-ignores]
# --- Fase 1 — leech.py + ytdlp.py ---
"bot/modules/leech.py"                                                    = ["C901", "E501", "E722", "I001"]
"bot/modules/ytdlp.py"                                                    = ["C901", "E501", "E722", "I001", "S307"]

# --- Fase 2 — task_config package (ex common.py) ---
"bot/helper/task_config/settings_resolver.py"                             = ["C901", "E501", "E722"]
"bot/helper/task_config/batch_tracker.py"                                 = ["C901", "E501", "E722"]
"bot/helper/task_config/multi_link.py"                                    = ["C901", "E501", "E722"]
"bot/helper/task_config/media_pipeline.py"                                = ["C901", "E501", "E722"]

# --- Fase 3 — direct_link_generators package (ex direct_link_generator.py) ---
# Handler dipindah apa adanya (perilaku tidak berubah), jadi utang lint ikut
# pindah. registry.py, _common.py, hosts/__init__.py, dan __init__.py sudah
# bersih dan sengaja tidak didaftarkan di sini.
"bot/helper/mirror_leech_utils/download_utils/direct_link_generators/hosts/cloud.py"         = ["E501"]
"bot/helper/mirror_leech_utils/download_utils/direct_link_generators/hosts/filehosts.py"     = ["E501"]
