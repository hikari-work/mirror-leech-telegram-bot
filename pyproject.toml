# --- Fase 5 — telegram_uploader._upload_file ---
# Seluruh entri untuk `telegram_uploader.py` sudah dicabut, dan itu bukan karena
# ambangnya dilonggarkan. E501/I001 hilang di Fase 5, E722 di Fase 10 (bare
