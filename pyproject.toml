# --- Fase 4 — debrid resolver ---
# alldebrid_resolver.py dan torbox_resolver.py sudah dibereskan; sisa E722
# adalah cleanup best-effort yang memang harus menelan apa pun (Fase 10).
"bot/helper/mirror_leech_utils/download_utils/alldebrid_resolver.py"      = ["E722"]

# --- Fase 5 — telegram_uploader._upload_file ---
# `_upload_file` sudah dipecah; E501 dan I001 dicabut. Sisa C901 ada di
# `upload()` (CX 42) yang jadi target Fase 6, dan satu E722 di properti
# `speed` yang masuk scope Fase 10.
"bot/helper/mirror_leech_utils/upload_utils/telegram_uploader.py"         = ["C901", "E722"]

# --- Fase 6 — task_listener.on_download_complete ---
# `on_download_complete` sudah dipecah; F401 dan I001 dicabut. Sisa C901 ada di
# tiga handler yang bukan target fase ini (`on_upload_complete` CX 15,
# `on_download_error` CX 17, `on_upload_error` CX 12) berikut dua E501 di
# dalamnya; E722 adalah cleanup best-effort. Semuanya scope Fase 10.
"bot/helper/listeners/task_listener.py"                                   = ["C901", "E501", "E722"]

# --- Fase 7 — settings UI ---
# `get_user_settings`/`get_menu` pindah ke package settings/ dan kedua router
# callback jadi dict dispatch, jadi C901/E501/E741/I001/E721 dicabut. S307 juga
# sudah dicabut: empat `eval()` diganti `settings/literals.parse_literal`
# (commit `fix:` tersendiri, karena perilakunya berubah — lihat
# REFACTOR_PLAN.md §Fase 7). Kedua file tidak punya utang lint lagi.

# --- Fase 8 — handlers.py ---
# `add_handlers()` jadi table-driven dan `from ..modules import *` diganti impor
# eksplisit, jadi F403/F405/I001 dicabut. File ini tidak punya utang lint lagi.

# --- Fase 9 — rss.py ---
