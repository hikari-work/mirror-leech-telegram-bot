[tool.ruff]
line-length = 88
target-version = "py314"
extend-exclude = [".venv", "qBittorrent"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors (includes E722 bare except)
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort — import order
    "UP",   # pyupgrade
    "C901", # mccabe complexity
    "S307", # suspicious eval usage
]

[tool.ruff.lint.mccabe]
max-complexity = 10

# Ledger utang lint: temuan yang sudah ada sebelum refactor, dicabut per fase
# (lihat REFACTOR_PLAN.md §3). Saat suatu fase menyentuh file, hapus barisnya
# dan bereskan temuan yang tersisa — baru dianggap selesai.
[tool.ruff.lint.per-file-ignores]
# --- Fase 1 — leech.py + ytdlp.py ---
"bot/modules/leech.py"                                                    = ["C901", "E501", "E722", "I001"]
"bot/modules/ytdlp.py"                                                    = ["C901", "E501", "E722", "I001", "S307"]

# --- Fase 2 — task_config package (ex common.py) ---
# settings_resolver.py sudah dicabut: `before_start()` dipecah jadi langkah
# bernama (Fase 2b), jadi C901/E501/E722 tidak ada lagi di file itu.
