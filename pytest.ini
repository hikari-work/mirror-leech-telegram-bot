# Pytest configuration

[pytest]
asyncio_mode = auto
testpaths = tests
addopts = -v --tb=short --strict-markers
filterwarnings =
    ignore::DeprecationWarning:pyrogram
    ignore::DeprecationWarning:telegram
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    db: marks tests that run against a real PostgreSQL (set PG_TEST_URL)
